<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="موظفو كوفي السلام"><link rel="apple-touch-icon" href="./coffee-icon-180.png?v=staffpro2"><title>موظفو كوفي السلام</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f6f8}iframe{border:0;width:100%;height:100%;display:block}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:10000;background:#111827;color:white;border-radius:999px;padding:12px 18px;font:800 14px -apple-system;display:none}</style></head><body><iframe id="app" src="./staff.html?v=20260907-staffpro2"></iframe><div id="toast" class="toast"></div><script>
const f=document.getElementById('app'),toast=document.getElementById('toast');function feedback(msg){try{navigator.vibrate?.([90,40,90]);const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=950;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09)}}catch(e){}toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',900)}
f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const input=d.getElementById('code'),enter=d.getElementById('enter');const saved=localStorage.getItem('staffCodePro')||localStorage.getItem('staffCode');if(input&&enter){enter.addEventListener('click',()=>{const v=input.value.trim();if(/^\d{6}$/.test(v)){localStorage.setItem('staffCodePro',v);localStorage.setItem('staffCode',v)}},true);if(saved){input.value=saved;setTimeout(()=>enter.click(),450)}}d.addEventListener('click',e=>{const b=e.target.closest('.product button');if(b)setTimeout(()=>feedback('تم تسجيل المنتج +1 ✓'),120)},true)});
</script></body></html>
