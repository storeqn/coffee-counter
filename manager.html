<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مدير الكوفي</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f4f6f8;color:#17202a}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000012;margin:16px 0}h1{margin:0 0 6px;font-size:25px}.muted{color:#6b7280;font-size:14px}input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:13px;font:inherit;margin:10px 0}button{border:0;border-radius:13px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:#111827;color:#fff;width:100%}.danger{background:#fee2e2;color:#991b1b}.hidden{display:none}.top{display:flex;justify-content:space-between;align-items:center}.err{color:#b91c1c;font-size:14px;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f8fafc;border-radius:16px;padding:15px;text-align:center}.stat b{font-size:20px;display:block}.green{color:#166534}.orange{color:#9a3412}.small{font-size:12px;color:#9ca3af;margin-top:18px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة الكوفي</h1><div id="cafeTitle" class="muted">الدخول برمز المدير</div></div><button id="logout" class="danger hidden">خروج</button></div>
<section id="login" class="card"><b>رمز مدير الكوفي</b><input id="code" inputmode="numeric" maxlength="6" placeholder="أدخل الرمز المكوّن من 6 أرقام"><button id="enter" class="primary">دخول</button><div id="err" class="err"></div></section>
<section id="panel" class="hidden"><div class="card"><b>ملخص اليوم</b><div class="grid"><div class="stat"><span class="muted">إجمالي النازل</span><b id="totalDown">0 د.ع</b></div><div class="stat"><span class="muted">الواصل</span><b id="totalPaid" class="green">0 د.ع</b></div><div class="stat"><span class="muted">الباقي</span><b id="totalRemain" class="orange">0 د.ع</b></div></div></div><div class="card"><b>المنتجات</b><div class="muted" style="margin-top:8px">سنضيف في الخطوة التالية بطاقات الناركيلة والجاي والمشروبات مع النازل والواصل والباقي.</div></div></section><div class="small">Coffee Counter • Manager</div></main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getDatabase,ref,get,set,onValue} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const config={apiKey:'AIzaSyBtXll7UcG6PrpQBZwRnewxgR9UmyqEp_s',authDomain:'coffee-counter-eb907.firebaseapp.com',databaseURL:'https://coffee-counter-eb907-default-rtdb.europe-west1.firebasedatabase.app',projectId:'coffee-counter-eb907',storageBucket:'coffee-counter-eb907.firebasestorage.app',messagingSenderId:'730169265694',appId:'1:730169265694:web:0172883b33e95e44d4a80f'};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let cafeId=null;
$('enter').onclick=async()=>{const code=$('code').value.trim();$('err').textContent='';if(!/^\d{6}$/.test(code)){ $('err').textContent='أدخل رمزًا من 6 أرقام.';return }try{if(!auth.currentUser)await signInAnonymously(auth);const snap=await get(ref(db,'accessCodes/'+code));const access=snap.val();if(!access||access.active!==true||access.role!=='manager'){throw new Error('bad-code')}cafeId=access.cafeId;await set(ref(db,'sessions/'+auth.currentUser.uid),{code,cafeId,role:'manager',createdAt:Date.now()});const cafeSnap=await get(ref(db,'cafes/'+cafeId));const cafe=cafeSnap.val();if(!cafe||cafe.active!==true)throw new Error('inactive');sessionStorage.setItem('managerCode',code);openPanel(cafe)}catch(e){$('err').textContent=e.message==='inactive'?'النظام موقوف من مالك النظام.':'رمز الدخول غير صحيح أو غير مفعل.'}};
$('logout').onclick=async()=>{sessionStorage.removeItem('managerCode');await signOut(auth);location.reload()};
function openPanel(cafe){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');$('cafeTitle').textContent=(cafe.name||'الكوفي')+(cafe.managerName?' • '+cafe.managerName:'');}
onAuthStateChanged(auth,async user=>{const code=sessionStorage.getItem('managerCode');if(user&&code){try{const a=(await get(ref(db,'accessCodes/'+code))).val();if(a&&a.role==='manager'&&a.active){cafeId=a.cafeId;await set(ref(db,'sessions/'+user.uid),{code,cafeId,role:'manager',createdAt:Date.now()});const c=(await get(ref(db,'cafes/'+cafeId))).val();if(c?.active)openPanel(c)}}catch(e){}}});
</script></body></html>
