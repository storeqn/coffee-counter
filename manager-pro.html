<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كوفي السلام"><link rel="apple-touch-icon" href="./coffee-icon-180.png?v=pro3"><title>إدارة كوفي السلام</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7}iframe{border:0;width:100%;height:100%;display:block}.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:10000;background:#111827;color:white;border-radius:999px;padding:11px 16px;font:800 13px -apple-system;display:none;white-space:nowrap}</style></head><body><iframe id="app" src="./manager.html?v=20260907-pro3"></iframe><div id="toast" class="toast"></div><script type="module">
const f=document.getElementById('app'),toast=document.getElementById('toast');let db,auth,ref,get,set,remove,signInAnonymously,code,cafeId;
function buzz(){try{navigator.vibrate?.([80,40,80]);const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.045;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09)}}catch(e){}}
function feedback(msg){buzz();toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',1300)}
function localDay(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
async function initFirebase(){const A=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js'),U=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js'),D=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js');const cfg={apiKey:'AIzaSyBtXll7UcG6PrpQBZwRnewxgR9UmyqEp_s',authDomain:'coffee-counter-eb907.firebaseapp.com',databaseURL:'https://coffee-counter-eb907-default-rtdb.europe-west1.firebasedatabase.app',projectId:'coffee-counter-eb907',storageBucket:'coffee-counter-eb907.firebasestorage.app',messagingSenderId:'730169265694',appId:'1:730169265694:web:0172883b33e95e44d4a80f'};const app=A.getApps().length?A.getApps()[0]:A.initializeApp(cfg);auth=U.getAuth(app);db=D.getDatabase(app);signInAnonymously=U.signInAnonymously;ref=D.ref;get=D.get;set=D.set;remove=D.remove}
async function resolveCafe(){code=localStorage.getItem('managerCodePro');if(!code)return false;if(!auth.currentUser)await signInAnonymously(auth);const a=(await get(ref(db,'accessCodes/'+code))).val();if(!a||a.role!=='manager'||a.active!==true)return false;cafeId=a.cafeId;await set(ref(db,'sessions/'+auth.currentUser.uid),{code,cafeId,role:'manager',createdAt:Date.now()});const c=(await get(ref(db,'cafes/'+cafeId))).val();return !!(c&&c.active===true)}
async function cleanShift(){if(!confirm('بدء دوام جديد؟ سيتم حذف تفاصيل البيع والواصل والمشتريات الظاهرة لهذا اليوم فقط.'))return;if(!confirm('تأكيد أخير: هل تريد تنظيف الدوام الآن؟'))return;try{if(!await resolveCafe())throw new Error('login');const day=localDay();await remove(ref(db,`cafes/${cafeId}/sales/${day}`));await remove(ref(db,`cafes/${cafeId}/purchases/${day}`));feedback('تم تنظيف الدوام ✓');setTimeout(()=>{try{f.contentWindow.location.reload()}catch(e){f.src='./manager.html?v=20260907-pro3&x='+Date.now()}},350)}catch(e){console.error(e);alert('تعذر التنظيف. سجّل الدخول بالرمز مرة واحدة ثم حاول مجددًا.')}}
function injectControls(){const d=f.contentDocument;if(!d)return;const saved=localStorage.getItem('managerCodePro');const input=d.getElementById('code'),enter=d.getElementById('enter');if(input&&enter){enter.addEventListener('click',()=>{const v=input.value.trim();if(/^\d{6}$/.test(v))localStorage.setItem('managerCodePro',v)},true);if(saved&&!d.getElementById('panel')?.classList.contains('hidden')){}else if(saved&&d.getElementById('login')&&!d.getElementById('login').classList.contains('hidden')){input.value=saved;setTimeout(()=>enter.click(),450)}}const logout=d.getElementById('logout');if(logout&&!d.getElementById('cleanShiftTop')){const clean=d.createElement('button');clean.id='cleanShiftTop';clean.textContent='🧹 تنظيف';clean.className='primary';clean.style.marginInlineStart='8px';clean.style.background='#111827';clean.style.color='#fff';clean.onclick=cleanShift;logout.parentElement?.insertBefore(clean,logout.nextSibling)}d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=(b.textContent||'').trim();if(t.includes('واصل'))setTimeout(()=>feedback('تم تسجيل واصل ✓'),120);else if(t.includes('إضافة'))setTimeout(()=>feedback('تمت الإضافة ✓'),120)},true)}
f.addEventListener('load',()=>setTimeout(injectControls,250));await initFirebase();
</script></body></html>
