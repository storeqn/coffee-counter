<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="كوفي السلام"><link rel="apple-touch-icon" href="./coffee-icon-180.png?v=pro2"><title>إدارة كوفي السلام</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f5f7}iframe{border:0;width:100%;height:100%;display:block}.tools{position:fixed;left:12px;bottom:14px;z-index:9999;display:flex;gap:8px;direction:rtl}.tools button{border:0;border-radius:999px;padding:11px 14px;font:800 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;box-shadow:0 5px 20px #0002}.clean{background:#111827;color:#fff}.device{background:#fee2e2;color:#991b1b}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:10000;background:#111827;color:white;border-radius:999px;padding:11px 16px;font:800 13px -apple-system;display:none}</style></head><body><iframe id="app" src="./manager.html?v=20260907-pro2"></iframe><div class="tools"><button class="clean" id="clean">🧹 تنظيف / دوام جديد</button><button class="device" id="device">🗑 حذف الجهاز</button></div><div id="toast" class="toast"></div><script type="module">
const f=document.getElementById('app'),toast=document.getElementById('toast');let db,auth,ref,get,set,remove,code,cafeId;
function feedback(msg){try{navigator.vibrate?.(120);const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=900;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.08)}}catch(e){}toast.textContent=msg;toast.style.display='block';setTimeout(()=>toast.style.display='none',1000)}
async function initFirebase(){try{const txt=await (await fetch('./manager.html?v=20260907-pro2')).text();const grab=k=>{const m=txt.match(new RegExp(k+":'([^']+)'"));return m&&m[1]};const cfg={apiKey:grab('apiKey'),authDomain:grab('authDomain'),databaseURL:grab('databaseURL'),projectId:grab('projectId'),storageBucket:grab('storageBucket'),messagingSenderId:grab('messagingSenderId'),appId:grab('appId')};const A=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js'),U=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js'),D=await import('https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js');const app=A.getApps().length?A.getApps()[0]:A.initializeApp(cfg);auth=U.getAuth(app);db=D.getDatabase(app);ref=D.ref;get=D.get;set=D.set;remove=D.remove}catch(e){console.error(e)}}
async function resolveCafe(){code=localStorage.getItem('managerCodePro')||localStorage.getItem('managerCode');if(!code||!db||!auth?.currentUser)return false;const a=(await get(ref(db,'accessCodes/'+code))).val();if(!a||a.role!=='manager'||a.active!==true)return false;cafeId=a.cafeId;return true}
f.addEventListener('load',()=>{const d=f.contentDocument;if(!d)return;const saved=localStorage.getItem('managerCodePro')||localStorage.getItem('managerCode');const input=d.getElementById('code'),enter=d.getElementById('enter');if(input&&enter){enter.addEventListener('click',()=>{const v=input.value.trim();if(/^\d{6}$/.test(v))localStorage.setItem('managerCodePro',v)},true);if(saved){input.value=saved;setTimeout(()=>enter.click(),500)}}d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=(b.textContent||'').trim();if(t.includes('واصل'))setTimeout(()=>feedback('تم تسجيل واصل ✓'),120);else if(t.includes('إضافة'))setTimeout(()=>feedback('تمت الإضافة ✓'),120)},true)});
document.getElementById('device').onclick=async()=>{if(!confirm('حذف الجهاز الحالي وكل طلبات الاعتماد؟'))return;try{if(!await resolveCafe())throw 0;await remove(ref(db,`cafes/${cafeId}/staffDevice`));try{await remove(ref(db,`cafes/${cafeId}/deviceRequests`))}catch(e){}feedback('تم حذف الجهاز ✓')}catch(e){alert('تعذر حذف الجهاز. افتح الإدارة وسجّل الدخول أولاً ثم حاول مجددًا.')}};
document.getElementById('clean').onclick=async()=>{if(!confirm('بدء دوام جديد؟ سيتم حفظ نسخة أرشيفية من حركات اليوم ثم تنظيف واجهة البيع والواصل.'))return;try{if(!await resolveCafe())throw 0;const day=new Date().toISOString().slice(0,10),salesRef=ref(db,`cafes/${cafeId}/sales/${day}`),pRef=ref(db,`cafes/${cafeId}/purchases/${day}`),sales=(await get(salesRef)).val()||{},purchases=(await get(pRef)).val()||{},id=Date.now();await set(ref(db,`cafes/${cafeId}/shiftArchives/${day}/${id}`),{createdAt:id,sales,purchases});await remove(salesRef);await remove(pRef);feedback('تم تنظيف الواجهة وبدء دوام جديد ✓')}catch(e){alert('لم يتم التنظيف لأن حفظ الأرشيف أو الصلاحيات لم تكتمل. لم أحذف البيانات.')}};
await initFirebase();setInterval(resolveCafe,1500);
</script></body></html>
