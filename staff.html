<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>موظفو الكوفي</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f4f6f8;color:#17202a}.wrap{max-width:640px;margin:auto;padding:20px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 30px #00000012;margin-top:18px}h1{margin:0 0 6px}.muted{color:#6b7280;font-size:14px}input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:13px;font:inherit;margin:12px 0}button{width:100%;border:0;border-radius:13px;padding:14px;background:#111827;color:#fff;font:inherit;font-weight:800}.err{color:#b91c1c;font-size:14px;margin-top:8px}</style></head><body><main class="wrap"><h1>واجهة الموظفين</h1><div class="muted">الدخول برمز الموظفين والجهاز المعتمد</div><section class="card"><b>رمز الموظفين</b><input inputmode="numeric" maxlength="6" placeholder="6 أرقام"><button>متابعة</button><div class="err">سنفعّل اعتماد الجهاز وأزرار صور المنتجات بعد ضبط قواعد Firebase.</div></section></main></body></html>
