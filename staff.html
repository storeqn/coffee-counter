<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="موظفو كوفي السلام"><meta name="theme-color" content="#f4f6f8"><title>موظفو كوفي السلام</title><link rel="apple-touch-icon" sizes="180x180" href="./coffee-icon-180.png?v=20260908-staff2"><link rel="icon" type="image/png" sizes="192x192" href="./coffee-icon-192.png?v=20260908-staff2"><link rel="manifest" href="./staff-manifest.json?v=20260908-staff2"><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:#f4f6f8;color:#17202a}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 30px #00000010;margin:14px 0}h1{margin:0}.muted{color:#6b7280;font-size:13px}.hidden{display:none}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}input{width:100%;padding:14px;border:1px solid #d1d5db;border-radius:13px;font:inherit;font-size:16px;margin:10px 0}button{border:0;border-radius:13px;padding:13px;font:inherit;font-weight:900;cursor:pointer}.primary{width:100%;background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.product{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:10px;box-shadow:0 4px 16px #00000008}.product button{width:100%;padding:0;background:transparent;color:inherit;text-align:right}.product img{width:100%;aspect-ratio:1.2;object-fit:cover;border-radius:13px;background:#f3f4f6}.pname{font-size:17px;font-weight:900;margin-top:8px}.price{font-size:14px;color:#166534;font-weight:900;margin-top:3px}.tap{margin-top:8px;background:#111827;color:#fff;border-radius:11px;padding:10px;text-align:center}.err{color:#b91c1c;font-size:14px;margin-top:8px}.wait{text-align:center;padding:12px 2px}.waitIcon{font-size:44px;margin-bottom:8px}.ok{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:9999}.ok.show{opacity:1}.small{font-size:12px;color:#9ca3af;margin-top:16px}@media(min-width:680px){.products{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><h1>واجهة الموظفين</h1><div id="cafeTitle" class="muted">الدخول برمز الموظفين</div></div><button id="logout" class="danger hidden">خروج</button></div><section id="login" class="card"><b>رمز الموظفين</b><input id="code" inputmode="numeric" maxlength="6" placeholder="أدخل الرمز المكوّن من 6 أرقام"><button id="enter" class="primary">دخول</button><div id="err" class="err"></div></section><section id="waiting" class="card hidden"><div class="wait"><div class="waitIcon">📱</div><b>بانتظار اعتماد هذا الجهاز</b><div class="muted" style="margin-top:8px">تم إرسال الطلب إلى مدير الكوفي. بعد الموافقة ستفتح المنتجات تلقائيًا.</div></div></section><section id="panel" class="hidden"><div class="card"><div class="row"><div><b>اختر المنتج</b><div class="muted">كل ضغطة تسجل قطعة واحدة مباشرة.</div></div></div><div id="products" class="products"></div></div></section><div class="small">Coffee Counter • Staff</div></main><div id="toast" class="ok">تم تسجيل المنتج +1 ✓</div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getDatabase,ref,get,set,onValue,push} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js';
const config={apiKey:'AIzaSyBtXll7UcG6PrpQBZwRnewxgR9UmyqEp_s',authDomain:'coffee-counter-eb907.firebaseapp.com',databaseURL:'https://coffee-counter-eb907-default-rtdb.europe-west1.firebasedatabase.app',projectId:'coffee-counter-eb907',storageBucket:'coffee-counter-eb907.firebasestorage.app',messagingSenderId:'730169265694',appId:'1:730169265694:web:0172883b33e95e44d4a80f'};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);let cafeId=null,cafeData=null,productsListening=false,deviceListenerStarted=false;
const dayKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('enter').onclick=async()=>{const code=$('code').value.trim();$('err').textContent='';if(!/^\d{6}$/.test(code)){$('err').textContent='أدخل رمزًا من 6 أرقام.';return}try{if(!auth.currentUser)await signInAnonymously(auth);const access=(await get(ref(db,'accessCodes/'+code))).val();if(!access||access.active!==true||access.role!=='staff')throw new Error('bad');cafeId=access.cafeId;await set(ref(db,'sessions/'+auth.currentUser.uid),{code,cafeId,role:'staff',createdAt:Date.now()});const cafe=(await get(ref(db,'cafes/'+cafeId))).val();if(!cafe||cafe.active!==true)throw new Error('inactive');cafeData=cafe;localStorage.setItem('staffCode',code);$('login').classList.add('hidden');$('logout').classList.remove('hidden');$('cafeTitle').textContent=cafe.name||'الكوفي';await checkDevice()}catch(e){$('err').textContent=e.message==='inactive'?'النظام موقوف من مالك النظام.':'رمز الدخول غير صحيح أو غير مفعل.'}};
$('logout').onclick=()=>{localStorage.removeItem('staffCode');location.reload()};
async function checkDevice(){const uid=auth.currentUser.uid;const deviceKey='staffApprovedDevice_'+cafeId;const saved=localStorage.getItem(deviceKey);const d=(await get(ref(db,`cafes/${cafeId}/staffDevice`))).val();if(d?.uid===uid||(d&&saved&&d.deviceKey===saved)){if(!saved){const k=d.deviceKey||uid;localStorage.setItem(deviceKey,k)}openPanel();watchDevice();return}if(d&&saved&&d.deviceKey!==saved){$('waiting').classList.remove('hidden');$('panel').classList.add('hidden');watchDevice();return}const requestKey=saved||localStorage.getItem('staffDeviceKey_'+cafeId)||crypto.randomUUID();localStorage.setItem('staffDeviceKey_'+cafeId,requestKey);const requests=(await get(ref(db,`cafes/${cafeId}/deviceRequests`))).val()||{};if(!Object.values(requests).some(r=>r&&r.deviceKey===requestKey))await set(ref(db,`cafes/${cafeId}/deviceRequests/${uid}`),{uid,deviceKey:requestKey,createdAt:Date.now(),label:deviceLabel()});$('waiting').classList.remove('hidden');$('panel').classList.add('hidden');watchDevice()}
function watchDevice(){if(deviceListenerStarted)return;deviceListenerStarted=true;onValue(ref(db,`cafes/${cafeId}/staffDevice`),s=>{const d=s.val();if(d?.uid===auth.currentUser?.uid||(d?.deviceKey&&d.deviceKey===localStorage.getItem('staffDeviceKey_'+cafeId))){if(d.deviceKey)localStorage.setItem('staffApprovedDevice_'+cafeId,d.deviceKey);$('waiting').classList.add('hidden');openPanel()}else if(!$('login').classList.contains('hidden')){}else{$('panel').classList.add('hidden');$('waiting').classList.remove('hidden')}})}
function openPanel(){$('login').classList.add('hidden');$('waiting').classList.add('hidden');$('panel').classList.remove('hidden');$('logout').classList.remove('hidden');if(productsListening)return;productsListening=true;onValue(ref(db,`cafes/${cafeId}/products`),s=>renderProducts(s.val()||{}))}
function renderProducts(data){const box=$('products');box.innerHTML='';Object.entries(data).filter(([,p])=>p.active!==false).forEach(([id,p])=>{const el=document.createElement('div');el.className='product';el.innerHTML=`<button>${p.image?`<img src="${escAttr(p.image)}" onerror="this.style.display='none'">`:''}<div class="pname">${esc(p.name||'منتج')}</div><div class="price">${money(p.price||0)}</div><div class="tap">تسجيل +1</div></button>`;let busy=false;el.querySelector('button').onclick=async()=>{if(busy)return;busy=true;try{const approved=(await get(ref(db,`cafes/${cafeId}/staffDevice`))).val();if(approved?.uid!==auth.currentUser.uid)throw new Error('device');await push(ref(db,`cafes/${cafeId}/sales/${dayKey()}`),{productId:id,productName:p.name||'منتج',price:Number(p.price)||0,status:'pending',createdAt:Date.now(),staffUid:auth.currentUser.uid});feedback()}catch(e){alert(e.message==='device'?'تم إلغاء اعتماد هذا الجهاز. راجع مدير الكوفي.':'تعذر تسجيل المنتج. تحقق من الصلاحيات.')}finally{setTimeout(()=>busy=false,350)}};box.appendChild(el)});if(!box.children.length)box.innerHTML='<div class="muted">لم يضف المدير منتجات بعد.</div>'}
onAuthStateChanged(auth,async user=>{const code=localStorage.getItem('staffCode');if(user&&code){try{const a=(await get(ref(db,'accessCodes/'+code))).val();if(a&&a.role==='staff'&&a.active){cafeId=a.cafeId;await set(ref(db,'sessions/'+user.uid),{code,cafeId,role:'staff',createdAt:Date.now()});const c=(await get(ref(db,'cafes/'+cafeId))).val();if(c?.active){cafeData=c;$('cafeTitle').textContent=c.name||'الكوفي';$('logout').classList.remove('hidden');$('login').classList.add('hidden');await checkDevice()}}}catch(e){}}});
function deviceLabel(){const ua=navigator.userAgent||'';if(/iPhone/i.test(ua))return 'iPhone';if(/iPad/i.test(ua))return 'iPad';if(/Android/i.test(ua))return 'Android';return 'جهاز الموظفين'}
function feedback(){try{navigator.vibrate?.([90,40,90]);const A=window.AudioContext||window.webkitAudioContext;if(A){const c=new A(),o=c.createOscillator(),g=c.createGain();o.frequency.value=950;g.gain.value=.06;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.09)}}catch(e){}const t=$('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),900)}
function money(n){return (Number(n)||0).toLocaleString('ar-IQ')+' د.ع'}function esc(s){return String(s).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function escAttr(s){return esc(s)}
</script></body></html>
